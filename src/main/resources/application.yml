spring:
  application:
    name: narayana-ucp-mq-demo

  # Disable default DataSource auto-configuration to use custom UCP configuration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

  # Narayana JTA configuration
  jta:
    narayana:
      transaction-manager-id: node1
      log-dir: target/narayana-logs
      default-timeout: 300

# Oracle Database configuration (used by UCP)
oracle:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: system
    password: oracle
    initial-pool-size: 5
    min-pool-size: 5
    max-pool-size: 20

# IBM MQ configuration
ibm:
  mq:
    queue-manager: QM1
    channel: DEV.ADMIN.SVRCONN
    conn-name: localhost(1414)
    user: admin
    password: passw0rd
    input-queue: DEV.QUEUE.1
    output-queue: DEV.QUEUE.2

# Logging
logging:
  level:
    com.example.narayana: DEBUG
    com.arjuna: DEBUG
    org.springframework.jms: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
